<!DOCTYPE html>
<html>
<head>
<title>Reset Password</title>

<!--Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!--Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<!--Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<!--Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!--Animate.css -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

<!-- Custom CSS --> <link rel="stylesheet" href="styles.css">

<body class="d-flex justify-content-center align-items-center">

<div class="card animate__animated animate__fadeIn">

<h3 class="text-center mb-3">Reset Password</h3>

<form>

<div class="mb-3">
<label class="form-label">New Password</label>

<div class="input-group">
<input type="password" class="form-control" id="newPassword" placeholder="Enter new password">
<span class="input-group-text" onclick="togglePassword('newPassword', this)">
<i class="bi bi-eye"></i>
</span>
</div>

</div>

<div class="mb-3">
<label class="form-label">Confirm Password</label>

<div class="input-group">
<input type="password" class="form-control" id="confirmPassword" placeholder="Confirm password">
<span class="input-group-text" onclick="togglePassword('confirmPassword', this)">
<i class="bi bi-eye"></i>
</span>
</div>

</div>

<a href="login.html">
<button type="button" class="btn btn-primary w-100">
    <i class="fa fa-key"></i> Update Password
</button>
</a>

</form>

<div class="text-center mt-3">
<a href="login.html">Back to Login</a>
</div>

</div>

</body>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Show/Hide Password Script -->
<script>
function togglePassword(id, icon) {
    const input = document.getElementById(id);
    const i = icon.querySelector("i");

    if (input.type === "password") {
        input.type = "text";
        i.classList.remove("bi-eye");
        i.classList.add("bi-eye-slash");
    } else {
        input.type = "password";
        i.classList.remove("bi-eye-slash");
        i.classList.add("bi-eye");
    }
}
</script>

</html>
